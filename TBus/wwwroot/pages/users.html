<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المستخدمون - UBus</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>
  <div id="sidebarMount"></div>

  <div class="main-wrapper">
    <header class="header">
      <div class="header-title">إدارة المستخدمين</div>
      <div class="header-actions">
        <button id="themeToggle" class="btn-icon" title="تغيير المظهر"></button>
        <button class="btn btn-outline btn-sm" onclick="loadUsers()">🔄 تحديث</button>
        <button class="btn btn-primary" onclick="openCreate()">+ إضافة مستخدم</button>
      </div>
    </header>

    <main class="page-content users-page">
      <div class="search-bar">
        <div class="search-input-wrap">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="بحث بالاسم أو اسم المستخدم...">
        </div>
        <select id="filterRole" style="width:auto;padding:9px 12px">
          <option value="">كل الأدوار</option>
          <option value="Admin">مدير</option>
          <option value="Driver">سائق</option>
        </select>
        <select id="filterStatus" style="width:auto;padding:9px 12px">
          <option value="">كل الحالات</option>
          <option value="active">نشط</option>
          <option value="blocked">محظور</option>
        </select>
      </div>

      <div class="card" style="padding:0">
        <div id="usersTable">
          <div class="loader"><div class="spinner"></div><span>جاري التحميل...</span></div>
        </div>
        <div id="pagination" class="pagination" style="padding:12px"></div>
      </div>
    </main>
  </div>

  <!-- Create Modal -->
  <div class="modal-overlay" id="formModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <div class="modal-title">إضافة مستخدم جديد</div>
        <button class="btn-icon" onclick="closeModal('formModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" id="fFullName" placeholder="الاسم الكامل">
          </div>
          <div class="form-group">
            <label>اسم المستخدم</label>
            <input type="text" id="fUserName" placeholder="username" dir="ltr">
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="fPassword" placeholder="كلمة المرور">
          </div>
          <div class="form-group">
            <label>تأكيد كلمة المرور</label>
            <input type="password" id="fConfirmPassword" placeholder="تأكيد">
          </div>
          <div class="form-group">
            <label>الدور</label>
            <select id="fRole" onchange="toggleDriverField()">
              <option value="1">سائق (Driver)</option>
              <option value="0">مدير (Admin)</option>
            </select>
          </div>
          <div class="form-group" id="driverIdGroup">
            <label>ربط بسائق</label>
            <select id="fDriverId"><option value="">— بدون ربط —</option></select>
          </div>
          <div class="form-group">
            <label>الرقم القومي (اختياري)</label>
            <input type="text" id="fNationalId" placeholder="14 رقم" maxlength="14">
          </div>
          <div class="form-group">
            <label>رقم الهاتف (اختياري)</label>
            <input type="tel" id="fPhone" placeholder="01xxxxxxxxx">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveBtn" onclick="createUser()">إنشاء</button>
        <button class="btn btn-outline" onclick="closeModal('formModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">تفاصيل المستخدم</div>
        <button class="btn-icon" onclick="closeModal('detailModal')">✕</button>
      </div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('detailModal')">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div class="modal-overlay" id="changePassModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <div class="modal-title">🔑 تغيير كلمة المرور</div>
        <button class="btn-icon" onclick="closeModal('changePassModal')">✕</button>
      </div>
      <div class="modal-body">
        <div style="background:var(--warning-light);border-radius:8px;padding:10px 14px;
                    margin-bottom:14px;font-size:13px;color:var(--warning)">
          ⚠️ يجب إدخال كلمة المرور الحالية للمستخدم.
        </div>
        <div class="form-group" style="margin-bottom:12px">
          <label>كلمة المرور الحالية</label>
          <input type="password" id="cpOld">
        </div>
        <div class="form-group" style="margin-bottom:12px">
          <label>كلمة المرور الجديدة</label>
          <input type="password" id="cpNew">
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور</label>
          <input type="password" id="cpConfirm">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="changePassBtn">تغيير</button>
        <button class="btn btn-outline" onclick="closeModal('changePassModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    if (!requireAuth()) throw '';
    document.getElementById('sidebarMount').innerHTML = buildSidebar('users');

    let allUsers   = [];
    let allDrivers = [];
    let currentPage = 1;
    const PER_PAGE  = 10;

    function getLastLoginValue(u) {
      return u.lastLoginAt || u.lastLogin || u.LastLoginAt || u.LastLogin || null;
    }

    function fmtLastLogin(u) {
      const v = getLastLoginValue(u);
      return v ? fmtDateTime(v) : 'لم يسجل دخول بعد';
    }

    /* ─── Load ─── */
    async function loadUsers() {
      document.getElementById('usersTable').innerHTML =
        '<div class="loader"><div class="spinner"></div><span>جاري التحميل...</span></div>';

      const [usersRes, driversRes] = await Promise.all([
        api.get('/authenticate/admin/users'),   // ← الـ endpoint الجديد
        api.get('/management/drivers'),
      ]);

      allDrivers = driversRes?.data || [];

      if (usersRes?.success) {
        allUsers = usersRes.data || [];
        renderTable();
      } else {
        toast(usersRes?.message || 'فشل تحميل المستخدمين', 'error');
        document.getElementById('usersTable').innerHTML =
          '<div class="empty-state"><p>فشل التحميل</p></div>';
      }
    }

    /* ─── Filter ─── */
    function getFiltered() {
      const q  = document.getElementById('searchInput').value.trim().toLowerCase();
      const r  = document.getElementById('filterRole').value;
      const st = document.getElementById('filterStatus').value;
      return allUsers.filter(u => {
        const mQ  = !q  || u.fullName?.toLowerCase().includes(q) || u.userName?.toLowerCase().includes(q);
        const mR  = !r  || u.role === r;
        const mSt = !st || (st === 'blocked' ? u.blocked : !u.blocked);
        return mQ && mR && mSt;
      });
    }

    /* ─── Render ─── */
    function renderTable() {
      const list  = getFiltered();
      const start = (currentPage - 1) * PER_PAGE;
      const page  = list.slice(start, start + PER_PAGE);

      if (!allUsers.length) {
        document.getElementById('usersTable').innerHTML =
          '<div class="empty-state" style="padding:40px"><p>لا يوجد مستخدمون</p></div>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      const rows = page.length ? page.map(u => {
        const safe   = JSON.stringify(u).replace(/"/g, '&quot;');
        const rBadge = u.role === 'Admin' ? 'badge-purple' : 'badge-info';
        const rLabel = u.role === 'Admin' ? '👑 مدير' : '🚗 سائق';
        return `<tr>
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:38px;height:38px;border-radius:50%;background:var(--primary-light);
                          color:var(--primary);display:flex;align-items:center;justify-content:center;
                          font-weight:700;font-size:16px;flex-shrink:0">
                ${(u.fullName||'U')[0].toUpperCase()}
              </div>
              <div>
                <div style="font-weight:600">${u.fullName||'—'}</div>
                <div style="font-size:12px;color:var(--text-muted)">@${u.userName}</div>
              </div>
            </div>
          </td>
          <td><span class="badge ${rBadge}">${rLabel}</span></td>
          <td>
            <span class="badge ${u.blocked?'badge-danger':'badge-success'}">
              ${u.blocked ? '🚫 محظور' : '✓ نشط'}
            </span>
          </td>
          <td>${u.login
            ? '<span class="badge badge-success">متصل</span>'
            : '<span class="badge" style="background:var(--bg);color:var(--text-muted)">غير متصل</span>'}
          </td>
          <td>${fmtLastLogin(u)}</td>
          <td>${fmtDate(u.createdAt)}</td>
          <td>
            <div style="display:flex;gap:5px;flex-wrap:wrap">
              <button class="btn btn-outline btn-xs" onclick='showDetail(${safe})'>👁</button>
              ${u.blocked
                ? `<button class="btn btn-success btn-xs" onclick="toggleBlock('${u.userId}',false)">✓ رفع الحظر</button>`
                : `<button class="btn btn-danger  btn-xs" onclick="toggleBlock('${u.userId}',true)">🚫 حظر</button>`}
              <button class="btn btn-outline btn-xs" onclick="openChangePass('${u.userId}')">🔑</button>
            </div>
          </td>
        </tr>`;
      }).join('') :
      `<tr><td colspan="7"><div class="empty-state"><p>لا توجد نتائج</p></div></td></tr>`;

      document.getElementById('usersTable').innerHTML = `
        <div style="padding:10px 16px;font-size:13px;color:var(--text-muted);border-bottom:1px solid var(--border)">
          إجمالي المستخدمين: <strong style="color:var(--text)">${allUsers.length}</strong>
        </div>
        <table>
          <thead><tr>
            <th>المستخدم</th><th>الدور</th><th>الحالة</th>
            <th>الاتصال</th><th>آخر تسجيل دخول</th><th>تاريخ الإنشاء</th><th>الإجراءات</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

      buildPagination(document.getElementById('pagination'),
        list.length, currentPage, PER_PAGE,
        p => { currentPage=p; renderTable(); });
    }

    ['searchInput','filterRole','filterStatus'].forEach(id =>
      document.getElementById(id).addEventListener(
        id==='searchInput' ? 'input' : 'change',
        () => { currentPage=1; renderTable(); }
      )
    );

    /* ─── Create ─── */
    function openCreate() {
      ['fFullName','fUserName','fNationalId','fPhone'].forEach(id =>
        document.getElementById(id).value = '');
      document.getElementById('fPassword').value        = '';
      document.getElementById('fConfirmPassword').value = '';
      document.getElementById('fRole').value            = '1';
      document.getElementById('fDriverId').innerHTML    =
        '<option value="">— بدون ربط —</option>' +
        allDrivers.map(d =>
          `<option value="${d.driverId}">${d.name} — ${d.nationalId}</option>`
        ).join('');
      toggleDriverField();
      openModal('formModal');
    }

    function toggleDriverField() {
      document.getElementById('driverIdGroup').style.display =
        document.getElementById('fRole').value === '1' ? 'flex' : 'none';
    }

    async function createUser() {
      const fullName        = document.getElementById('fFullName').value.trim();
      const userName        = document.getElementById('fUserName').value.trim();
      const password        = document.getElementById('fPassword').value;
      const confirmPassword = document.getElementById('fConfirmPassword').value;
      const role            = parseInt(document.getElementById('fRole').value);
      const driverId        = document.getElementById('fDriverId').value || null;
      const nationalId      = document.getElementById('fNationalId').value.trim() || null;
      const phoneNumber     = document.getElementById('fPhone').value.trim() || null;

      if (!fullName)  { toast('الاسم الكامل مطلوب', 'error');  return; }
      if (!userName)  { toast('اسم المستخدم مطلوب', 'error'); return; }
      if (!password)  { toast('كلمة المرور مطلوبة', 'error');  return; }
      if (password !== confirmPassword) { toast('كلمتا المرور غير متطابقتين', 'error'); return; }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.textContent = 'جاري الإنشاء...';

      const res = await api.post('/authenticate/admin/create-user',
        { fullName, userName, password, confirmPassword, role, driverId, nationalId, phoneNumber });

      btn.disabled = false; btn.textContent = 'إنشاء';

      if (res?.success) {
        toast('تم إنشاء المستخدم بنجاح ✓');
        closeModal('formModal');
        await loadUsers();   // تحديث القائمة بالكامل
      } else {
        toast(res?.message || 'فشل الإنشاء', 'error');
      }
    }

    /* ─── Detail ─── */
    function showDetail(u) {
      if (typeof u === 'string') { try { u = JSON.parse(u); } catch { return; } }
      const rBadge = u.role === 'Admin' ? 'badge-purple' : 'badge-info';
      const rLabel = u.role === 'Admin' ? '👑 مدير' : '🚗 سائق';
      document.getElementById('detailBody').innerHTML = `
        <div style="text-align:center;margin-bottom:20px">
          <div style="width:68px;height:68px;border-radius:50%;background:var(--primary-light);
                      color:var(--primary);display:flex;align-items:center;justify-content:center;
                      font-weight:700;font-size:26px;margin:0 auto 10px">
            ${(u.fullName||'U')[0].toUpperCase()}
          </div>
          <h3 style="font-size:18px">${u.fullName||'—'}</h3>
          <span style="color:var(--text-muted);font-size:14px">@${u.userName}</span>
        </div>
        <div class="detail-grid">
          <div class="detail-item"><label>الدور</label>
            <div class="detail-value"><span class="badge ${rBadge}">${rLabel}</span></div></div>
          <div class="detail-item"><label>الحالة</label>
            <div class="detail-value">
              <span class="badge ${u.blocked?'badge-danger':'badge-success'}">
                ${u.blocked?'🚫 محظور':'✓ نشط'}</span></div></div>
          <div class="detail-item"><label>تاريخ الإنشاء</label>
            <div class="detail-value">${fmtDateTime(u.createdAt)}</div></div>
          <div class="detail-item"><label>تسجيل الدخول</label>
            <div class="detail-value">${u.login?'متصل الآن':'غير متصل'}</div></div>
          <div class="detail-item"><label>آخر تسجيل دخول</label>
            <div class="detail-value">${fmtLastLogin(u)}</div></div>
          ${u.driverId?`<div class="detail-item full"><label>مرتبط بسائق</label>
            <div class="detail-value" style="font-size:12px;font-family:monospace">${u.driverId}</div></div>`:''}
          <div class="detail-item full"><label>معرّف المستخدم</label>
            <div class="detail-value" style="font-size:12px;font-family:monospace;word-break:break-all">${u.userId}</div></div>
        </div>`;
      openModal('detailModal');
    }

    /* ─── Block / Unblock ─── */
      async function toggleBlock(userId, block) {
          const path = block
              ? `/Authenticate/admin/block-user/${userId}`
              : `/Authenticate/admin/unblock-user/${userId}`;

          const res = await api.put(path, {});

          if (res?.success) {
              toast(block ? 'تم الحظر ✓' : 'تم رفع الحظر ✓');
              await loadUsers();
          } else {
              toast(res?.message || 'فشل الإجراء', 'error');
          }
      }

    /* ─── Change Password ─── */
    function openChangePass(userId) {
      ['cpOld','cpNew','cpConfirm'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('changePassBtn').onclick = async () => {
        const oldPassword     = document.getElementById('cpOld').value;
        const newPassword     = document.getElementById('cpNew').value;
        const confirmPassword = document.getElementById('cpConfirm').value;
        if (!oldPassword || !newPassword) { toast('جميع الحقول مطلوبة', 'error'); return; }
        if (newPassword !== confirmPassword) { toast('كلمتا المرور غير متطابقتين', 'error'); return; }
        document.getElementById('changePassBtn').disabled = true;
        const res = await api.post('/authenticate/change-password',
          { userId, oldPassword, newPassword, confirmPassword });
        document.getElementById('changePassBtn').disabled = false;
        if (res?.success) {
          toast('تم تغيير كلمة المرور ✓');
          closeModal('changePassModal');
        } else {
          toast(res?.message || 'فشل التغيير', 'error');
        }
      };
      openModal('changePassModal');
    }

    loadUsers();
  </script>
</body>
</html>
