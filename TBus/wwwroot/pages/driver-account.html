<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حسابي - UBus</title><link rel="stylesheet" href="../css/style.css"><style>
    .tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:20px;width:fit-content;max-width:100%;overflow-x:auto}
    .tab-btn{padding:8px 22px;border-radius:calc(var(--radius) - 2px);border:none;background:transparent;color:var(--text-muted);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;white-space:nowrap}.tab-btn.active{background:var(--bg-card);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}.tab-panel{display:none}.tab-panel.active{display:block}
    .money-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.money-box{border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:11px 13px;min-height:76px}.money-label{font-size:12px;color:var(--text-muted);margin-bottom:7px}.money-value{font-size:16px;font-weight:900;color:var(--text)}.money-value.green{color:var(--success)}.money-value.red{color:var(--danger)}.money-value.blue{color:var(--info)}.money-value.amber{color:var(--warning)}
    .trip-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}.trip-card.done{border-right:5px solid var(--success)}.trip-card.not-done{border-right:5px solid var(--warning)}.trip-card-header{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 18px;gap:12px;flex-wrap:wrap}.trip-title{font-weight:800;font-size:16px;color:var(--text)}.trip-meta{font-size:12px;color:var(--text-muted);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.trip-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.trip-card-section{border-top:1px solid var(--border);padding:14px 18px}.trip-section-title{font-weight:800;font-size:14px;color:var(--text);margin-bottom:10px;text-align:right}.list-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item-list{display:flex;flex-direction:column;gap:8px}.item-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px 12px}.item-row.tahseel{border-right:4px solid var(--success)}.item-row.payment{border-right:4px solid var(--warning)}.item-main{min-width:0}.item-amount{font-weight:900;font-size:15px}.item-note{color:var(--text-muted);font-size:12px;margin-top:3px}.item-actions{display:flex;gap:7px;align-items:center}.empty-line{border:1px dashed var(--border);border-radius:10px;padding:12px;color:var(--text-muted);font-size:13px;background:var(--bg)}.locked-strip{background:var(--success-light);color:var(--success);border:1px solid rgba(34,197,94,.20);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:800;margin-top:10px;display:inline-flex;gap:6px;align-items:center}.net-pill{border-radius:999px;padding:7px 12px;font-size:13px;font-weight:900;white-space:nowrap}.net-get{background:var(--success-light);color:var(--success)}.net-pay{background:var(--danger-light);color:var(--danger)}.net-zero{background:var(--info-light);color:var(--info)}.filters-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}.summary-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px}.summary-label{font-size:12px;color:var(--text-muted);margin-bottom:6px}.summary-value{font-size:16px;font-weight:900;color:var(--text)}.hist-row{cursor:pointer}.hist-row:hover td{background:var(--bg)}.accounted-badge{background:var(--success-light);color:var(--success)}.pending-badge{background:var(--warning-light);color:var(--warning)}
    @media(max-width:760px){.list-grid{grid-template-columns:1fr}.trip-card-header{padding:12px}.trip-card-section{padding:12px}.money-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.trip-actions{width:100%;justify-content:flex-start}.filters-row input,.filters-row select,.filters-row .btn{flex:1 1 140px}.tabs{width:100%}}
    @media(max-width:430px){.money-grid{grid-template-columns:1fr}.tab-btn{padding:8px 14px}.trip-title{font-size:15px}}
</style></head>
<body><div id="toastContainer" class="toast-container"></div><div id="sidebarMount"></div><div class="main-wrapper"><header class="header"><div class="header-title">حسابي</div><div class="header-actions"><button id="themeToggle" class="btn-icon" title="تغيير المظهر"></button></div></header><main class="page-content"><div id="profileCard" style="margin-bottom:20px"><div class="loader"><div class="spinner"></div></div></div><div class="stats-grid" id="myStats" style="margin-bottom:20px"><div class="stat-card"><div class="spinner" style="margin:auto"></div></div></div><div class="card"><div class="card-header"><div class="card-title">🗺️ جميع رحلاتي وحساباتي</div><div class="filters-row"><input type="date" id="fromDate" title="من تاريخ" style="width:auto" onchange="renderTrips()"><input type="date" id="toDate" title="إلى تاريخ" style="width:auto" onchange="renderTrips()"><select id="doneFilter" style="width:auto;padding:9px 12px" onchange="renderTrips()"><option value="">كل الحالات</option><option value="done">تم الحساب</option><option value="notDone">لم يتم الحساب</option></select><select id="busFilter" style="width:auto;padding:9px 12px" onchange="renderTrips()"><option value="">كل الحافلات</option></select><button class="btn btn-outline btn-sm" onclick="clearFilter()">كل الرحلات</button><button class="btn btn-outline btn-sm" onclick="downloadExcel()">⬇ تنزيل Excel</button></div></div><div class="search-bar" style="margin-bottom:12px"><div class="search-input-wrap"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" id="searchInput" placeholder="بحث بالمسار أو الحافلة..." oninput="renderTrips()"></div></div><div id="tripsContainer"><div class="loader"><div class="spinner"></div><span>جاري التحميل...</span></div></div><div id="pagination" class="pagination" style="padding:8px 0 4px"></div></div></main></div><div class="modal-overlay" id="tripModal"><div class="modal modal-lg"><div class="modal-header"><div class="modal-title">تفاصيل الرحلة</div><button class="btn-icon" onclick="closeModal('tripModal')">✕</button></div><div class="modal-body" id="tripModalBody"></div><div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('tripModal')">إغلاق</button></div></div></div>
<script src="../js/app.js"></script><script src="../js/xlsx-bundle.js"></script><script>

    function n(v){ const x = Number(v ?? 0); return Number.isFinite(x) ? x : 0; }
    function fmtMoney(value){ const x = n(value); const rounded = Math.round(x * 100) / 100; const txt = Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1'); return `${txt} ج.م`; }
    function esc(v){ return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function idOf(x,...ks){ for(const k of ks){ if(x && x[k] !== undefined && x[k] !== null) return x[k]; } return ''; }
    function paymentsOf(t){ return t?.payments || t?.Payments || []; }
    function tahseelOf(t){ return t?.tahseelItems || t?.TahseelItems || t?.tahseels || t?.Tahseels || []; }
    function amountOf(x){ return n(x?.amount ?? x?.Amount); }
    function noteOf(x){ return x?.notes || x?.Notes || ''; }
    function userOf(x){ return x?.userName || x?.UserName || x?.createdByName || x?.CreatedByName || x?.userFullName || x?.fullName || x?.addedBy || x?.AddedBy || '—'; }
    function tripIdOf(t){ return idOf(t,'tripId','TripId'); }
    function payIdOf(p){ return idOf(p,'paymentId','PaymentId'); }
    function tahIdOf(x){ return idOf(x,'tahseelId','TahseelId'); }
    function tripDateOf(t){ return t?.tripDate || t?.TripDate || ''; }
    function totalPayments(t){ return n(t?.totalPayments ?? t?.TotalPayments ?? paymentsOf(t).reduce((s,p)=>s+amountOf(p),0)); }
    function totalTahseel(t){ return n(t?.totalTahseel ?? t?.TotalTahseel ?? tahseelOf(t).reduce((s,x)=>s+amountOf(x),0)); }
    function cashRemaining(t){ return n(t?.cache ?? t?.Cache); }
    function solar(t){ return n(t?.solar ?? t?.Solar); }
    function tripPrice(t){ return n(t?.tripPrice ?? t?.TripPrice); }
    function driverPrice(t){ return n(t?.driverPrice ?? t?.DriverPrice); }
    function isDone(t){ return t?.isDone === true || t?.IsDone === true; }
    function routeLabel(t){ return `${t?.fromLocation || t?.FromLocation || ''} ← ${t?.toLocation || t?.ToLocation || ''}`; }
    function busLabel(t){ const name = t?.busName || t?.BusName || '—'; const plate = t?.busPalateNumber || t?.BusPalateNumber || ''; return `${name}${plate ? ' - ' + plate : ''}`; }
    function isCompanyTrip(t){ return t?.isCompany === true || t?.IsCompany === true || t?.inSide === true || t?.InSide === true; }
    function companyNameOf(t){ return (t?.companyName || t?.CompanyName || '').trim(); }
    function tripTypeBadge(t){ return isCompanyTrip(t) ? `<span class="badge badge-purple">شركة أخرى: ${esc(companyNameOf(t) || '—')}</span>` : '<span class="badge badge-success">رحلات Go Bus</span>'; }
    function tripCreatedBy(t){ return t?.adminName || t?.AdminName || t?.userFullName || t?.createdByName || t?.createdBy || t?.userName || '—'; }
    function currentUserId(){ const u = Auth.getUser() || {}; return u.id || u.userId || u.UserId || ''; }
    function parseCoverage(paymentType, amount){
      const raw = String(paymentType || '').trim(); const lower = raw.toLowerCase(); const fallback = amount;
      if(raw.toLowerCase().startsWith('mixed')){
        const get = key => { const m = raw.match(new RegExp(key + '=([0-9.]+)', 'i')); return m ? n(m[1]) : 0; };
        return { cash:get('Cache'), tahseel:get('Tahseel'), pocket:get('NoCustody') };
      }
      if(lower.includes('tahseel') || lower.includes('تحصيل')) return { cash:0, tahseel:fallback, pocket:0 };
      if(lower.includes('nocustody') || lower.includes('no custody') || lower.includes('بدون') || lower.includes('جيب')) return { cash:0, tahseel:0, pocket:fallback };
      return { cash:fallback, tahseel:0, pocket:0 };
    }
    function paymentCoverage(p){ return parseCoverage(p?.paymentType || p?.PaymentType || p?.paymentSource || p?.source, amountOf(p)); }
    function usedCash(t){ return paymentsOf(t).reduce((s,p)=>s+paymentCoverage(p).cash,0); }
    function usedTahseel(t){ return paymentsOf(t).reduce((s,p)=>s+paymentCoverage(p).tahseel,0); }
    function paidPocket(t){ return n(t?.driverPaidFromPocket ?? t?.DriverPaidFromPocket ?? paymentsOf(t).reduce((s,p)=>s+paymentCoverage(p).pocket,0)); }
    function originalCustody(t){ return n(t?.originalCustody ?? t?.OriginalCustody ?? (cashRemaining(t) + usedCash(t))); }
    function tahseelRemaining(t){ return n(t?.tahseelRemaining ?? t?.TahseelRemaining ?? Math.max(0, totalTahseel(t) - usedTahseel(t))); }
    function remainingWithDriver(t){ return n(t?.totalAvailableMoney ?? t?.TotalAvailableMoney ?? (cashRemaining(t) + tahseelRemaining(t))); }
    function driverAccount(t){ return n(t?.driverAccountAmount ?? t?.DriverAccountAmount ?? (driverPrice(t) + paidPocket(t))); }
    function netForDriver(t){ return driverAccount(t) - remainingWithDriver(t); }
    function driverNetLabel(a){ return a > 0 ? 'ليّا' : a < 0 ? 'عليّا' : 'متوازن'; }
    function netClass(a){ return a > 0 ? 'net-get' : a < 0 ? 'net-pay' : 'net-zero'; }
    function netPill(t){ const a = netForDriver(t); return `<span class="net-pill ${netClass(a)}">${driverNetLabel(a)} ${fmtMoney(Math.abs(a))}</span>`; }
    function allocationTextFromPayment(p){ const c = paymentCoverage(p); const parts=[]; if(c.cash>0) parts.push(`${fmtMoney(c.cash)} من العهدة`); if(c.tahseel>0) parts.push(`${fmtMoney(c.tahseel)} من التحصيل`); if(c.pocket>0) parts.push(`${fmtMoney(c.pocket)} من جيب السائق`); return parts.join(' + ') || 'مصروف'; }
    function moneyGrid(t){ const a = netForDriver(t); return `<div class="money-grid">
      <div class="money-box"><div class="money-label">سعر التشغيلة</div><div class="money-value">${fmtMoney(tripPrice(t))}</div></div>
      <div class="money-box"><div class="money-label">كومسيون السائق</div><div class="money-value">${fmtMoney(driverPrice(t))}</div></div>
      <div class="money-box"><div class="money-label">العهدة الأصلية</div><div class="money-value blue">${fmtMoney(originalCustody(t))}</div></div>
      <div class="money-box"><div class="money-label">المتبقي من العهدة</div><div class="money-value blue">${fmtMoney(cashRemaining(t))}</div></div>
      <div class="money-box"><div class="money-label">إجمالي التحصيل</div><div class="money-value green">${fmtMoney(totalTahseel(t))}</div></div>
      <div class="money-box"><div class="money-label">المتبقي من التحصيل</div><div class="money-value green">${fmtMoney(tahseelRemaining(t))}</div></div>
      <div class="money-box"><div class="money-label">المصروفات</div><div class="money-value red">${fmtMoney(totalPayments(t))}</div></div>
      <div class="money-box"><div class="money-label">سولار</div><div class="money-value amber">${fmtMoney(solar(t))}</div></div>
      <div class="money-box"><div class="money-label">دفع من جيبه</div><div class="money-value red">${fmtMoney(paidPocket(t))}</div></div>
      <div class="money-box"><div class="money-label">المتبقي معه</div><div class="money-value blue">${fmtMoney(remainingWithDriver(t))}</div></div>
      <div class="money-box"><div class="money-label">حساب السائق</div><div class="money-value">${fmtMoney(driverAccount(t))}</div></div>
      <div class="money-box"><div class="money-label">الصافي</div><div class="money-value ${a>0?'green':a<0?'red':''}">${driverNetLabel(a)} ${fmtMoney(Math.abs(a))}</div></div>
    </div>`; }
    function itemRows(items, type, editable, trip){
      if(!items.length) return '<div class="empty-line">لا توجد بيانات</div>';
      return items.map(x => {
        const isPayment = type === 'payment'; const id = isPayment ? payIdOf(x) : tahIdOf(x);
        const amt = amountOf(x); const note = noteOf(x) || 'بدون ملاحظات';
        const sub = isPayment ? allocationTextFromPayment(x) : `بواسطة: ${userOf(x)}`;
        const actions = editable && !isDone(trip) ? `<div class="item-actions"><button class="btn btn-outline btn-xs" onclick="${isPayment ? `openEditPay('${id}')` : `openEditTahseel('${id}')`}">تعديل</button><button class="btn btn-danger btn-xs" onclick="${isPayment ? `openDelPay('${id}')` : `openDelTahseel('${id}')`}">حذف</button></div>` : '';
        return `<div class="item-row ${isPayment?'payment':'tahseel'}"><div class="item-main"><div><span class="item-amount ${isPayment?'text-danger':'text-success'}">${fmtMoney(amt)}</span> <span class="item-note">${esc(note)}</span></div><div class="item-note">${esc(sub)}${isPayment ? ' - بواسطة: ' + esc(userOf(x)) : ''}</div></div>${actions}</div>`;
      }).join('');
    }

    let myTrips=[], driverInfo=null, currentPage=1; const PER_PAGE=10; if(!requireAuth())throw''; document.getElementById('sidebarMount').innerHTML=buildSidebar('driver-account');
    function populateBusFilter(){ const sel=document.getElementById("busFilter"); if(!sel) return; const current=sel.value; const map=new Map(); myTrips.forEach(t=>{ const id=busIdOf(t); if(!id) return; if(!map.has(id)) map.set(id,busLabel(t)); }); sel.innerHTML='<option value="">كل الحافلات</option>' + Array.from(map.entries()).sort((a,b)=>a[1].localeCompare(b[1],'ar')).map(([id,label])=>`<option value="${esc(id)}">${esc(label)}</option>`).join(''); if(map.has(current)) sel.value=current; }

    async function init(){ const role=await resolveRole(); if(role!=='Driver'){ location.href='/pages/dashboard.html'; return; } if(!Auth.getUser()?.driverId){ showNoDriver(); return; } const [drRes,trRes]=await Promise.all([api.get('/driver/my-profile'),api.get('/driver/my-trips')]); if(drRes?.success){ driverInfo=drRes.data; renderProfile(); } if(trRes?.success) myTrips=trRes.data||[]; else toast('تعذر تحميل الرحلات','error'); populateBusFilter(); renderStats(); renderTrips(); }
    function showNoDriver(){ const msg='<div class="empty-state" style="padding:60px 20px"><h3>الحساب غير مرتبط بسائق</h3><p>تواصل مع المدير لربط حسابك بملف السائق.</p></div>'; profileCard.innerHTML=msg; myStats.innerHTML=''; tripsContainer.innerHTML=msg; }
    function renderProfile(){ const phones=driverInfo?.phoneNumbers?.length ? driverInfo.phoneNumbers.map(p=>`<span class="badge badge-info" style="margin-left:4px">${esc(p)}</span>`).join('') : '<span class="text-muted">لا يوجد</span>'; profileCard.innerHTML=`<div class="card"><div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div style="width:68px;height:68px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex-shrink:0">${esc((driverInfo?.name||'س')[0])}</div><div style="flex:1;min-width:0"><div style="font-size:20px;font-weight:800">${esc(driverInfo?.name||'—')}</div><div style="font-size:13px;color:var(--text-muted);margin-top:3px">الرقم القومي: <strong>${esc(driverInfo?.nationalId||'—')}</strong> | سائق منذ ${fmtDate(driverInfo?.jouinAt)}</div><div style="margin-top:8px">${phones}</div></div></div></div>`; }
    function getFiltered(){ const q=(searchInput?.value||'').trim().toLowerCase(), f=fromDate.value, to=toDate.value, done=doneFilter.value, bus=(document.getElementById('busFilter')?.value||''); return myTrips.filter(t=>(!q||routeLabel(t).toLowerCase().includes(q)||busLabel(t).toLowerCase().includes(q)) && (!bus || busIdOf(t)===bus) && (!f||(tripDateOf(t)||'').slice(0,10)>=f) && (!to||(tripDateOf(t)||'').slice(0,10)<=to) && (!done||(done==='done'?isDone(t):!isDone(t)))).sort((a,b)=>new Date(tripDateOf(b))-new Date(tripDateOf(a))); }
    function renderStats(){ const filtered=getFiltered(), unsettled=filtered.filter(t=>!isDone(t)); const net=unsettled.reduce((s,t)=>s+netForDriver(t),0); myStats.innerHTML=`<div class="stat-card"><div class="stat-icon amber">🗺️</div><div><div class="stat-value">${filtered.length}</div><div class="stat-label">إجمالي الرحلات</div></div></div><div class="stat-card"><div class="stat-icon blue">💼</div><div><div class="stat-value" style="font-size:15px">${fmtMoney(filtered.reduce((s,t)=>s+originalCustody(t),0))}</div><div class="stat-label">إجمالي العهدة الأصلية</div></div></div><div class="stat-card"><div class="stat-icon green">💵</div><div><div class="stat-value" style="font-size:15px">${fmtMoney(filtered.reduce((s,t)=>s+totalTahseel(t),0))}</div><div class="stat-label">إجمالي التحصيل</div></div></div><div class="stat-card"><div class="stat-icon red">🧾</div><div><div class="stat-value" style="font-size:15px">${fmtMoney(filtered.reduce((s,t)=>s+totalPayments(t),0))}</div><div class="stat-label">إجمالي المصروفات</div></div></div><div class="stat-card"><div class="stat-icon green">👨‍✈️</div><div><div class="stat-value" style="font-size:15px">${driverNetLabel(net)} ${fmtMoney(Math.abs(net))}</div><div class="stat-label">صافي غير المحاسب</div></div></div><div class="stat-card"><div class="stat-icon blue">✓</div><div><div class="stat-value">${filtered.filter(isDone).length}</div><div class="stat-label">رحلات اتحاسبت</div></div></div><div class="stat-card"><div class="stat-icon red">!</div><div><div class="stat-value">${unsettled.length}</div><div class="stat-label">لسه متحاسبتش</div></div></div>`; }
    function clearFilter(){ fromDate.value=''; toDate.value=''; searchInput.value=''; doneFilter.value=''; if(document.getElementById('busFilter')) busFilter.value=''; currentPage=1; renderStats(); renderTrips(); }
    function renderTrips(){ renderStats(); const list=getFiltered(), start=(currentPage-1)*PER_PAGE, page=list.slice(start,start+PER_PAGE); if(!myTrips.length){ tripsContainer.innerHTML='<div class="empty-state" style="padding:40px"><p>لا توجد رحلات مسجلة</p></div>'; pagination.innerHTML=''; return; } if(!page.length){ tripsContainer.innerHTML='<div class="empty-state"><p>لا توجد نتائج مطابقة</p></div>'; pagination.innerHTML=''; return; } tripsContainer.innerHTML=`<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المسار</th><th>الحافلة</th><th>الحالة</th><th>العهدة الأصلية</th><th>التحصيل</th><th>المصروفات</th><th>الصافي</th><th></th></tr></thead><tbody>${page.map(t=>`<tr class="hist-row ${isDone(t)?'done':'not-done'}" onclick="showDetail('${tripIdOf(t)}')"><td>${fmtDate(tripDateOf(t))}</td><td><strong>${esc(routeLabel(t))}</strong><div class="trip-meta">أنشأها: ${esc(tripCreatedBy(t))} | ${tripTypeBadge(t)}</div></td><td>${esc(busLabel(t))}</td><td><span class="badge ${isDone(t)?'accounted-badge':'pending-badge'}">${isDone(t)?'✓ تم الحساب':'لم يتم الحساب'}</span></td><td>${fmtMoney(originalCustody(t))}</td><td class="text-success fw-600">${fmtMoney(totalTahseel(t))}</td><td class="text-danger fw-600">${fmtMoney(totalPayments(t))}</td><td>${netPill(t)}</td><td>›</td></tr>`).join('')}</tbody></table></div>`; buildPagination(pagination,list.length,currentPage,PER_PAGE,p=>{currentPage=p;renderTrips();}); }
    function showDetail(id){ const t=myTrips.find(x=>tripIdOf(x)===id); if(!t)return; tripModalBody.innerHTML=`<div style="background:var(--primary-light);border-radius:12px;padding:16px 20px;margin-bottom:18px"><div style="font-size:18px;font-weight:900;color:var(--primary)">${esc(routeLabel(t))}</div><div class="trip-meta">${fmtDateTime(tripDateOf(t))} | ${tripTypeBadge(t)} | <span class="badge ${isDone(t)?'accounted-badge':'pending-badge'}">${isDone(t)?'تم الحساب':'لم يتم الحساب'}</span></div></div>${moneyGrid(t)}<div class="trip-card-section"><div class="list-grid"><div><div class="trip-section-title">التحصيلات</div>${itemRows(tahseelOf(t),'tahseel',false,t)}</div><div><div class="trip-section-title">المصروفات</div>${itemRows(paymentsOf(t),'payment',false,t)}</div></div></div>`; openModal('tripModal'); }
    function downloadExcel(){ const trips=getFiltered(); if(!trips.length){toast('لا توجد بيانات للتصدير','error');return;} if(typeof XLSX==='undefined'){toast('تعذر تحميل مكتبة Excel','error');return;} const rows=trips.map(t=>({التاريخ:fmtDate(tripDateOf(t)),المسار:routeLabel(t),الحافلة:busLabel(t),الحالة:isDone(t)?'تم الحساب':'لم يتم الحساب',العهدة_الأصلية:originalCustody(t),المتبقي_من_العهدة:cashRemaining(t),التحصيل:totalTahseel(t),المتبقي_من_التحصيل:tahseelRemaining(t),المصروفات:totalPayments(t),سولار:solar(t),دفع_من_جيبه:paidPocket(t),المتبقي_معه:remainingWithDriver(t),حساب_السائق:driverAccount(t),الصافي:`${driverNetLabel(netForDriver(t))} ${Math.abs(netForDriver(t))}`})); const ws=XLSX.utils.json_to_sheet(rows); ws['!dir']='rtl'; const wb=XLSX.utils.book_new(); wb.Workbook={Views:[{RTL:true}]}; XLSX.utils.book_append_sheet(wb,ws,'حسابي'); XLSX.writeFile(wb,`driver-account-${new Date().toISOString().slice(0,10)}.xlsx`); }
    init();
</script></body></html>
