<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>UBus</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#f1f5f9; }
    .loader { text-align:center; color:#64748b; }
    .spinner { width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px }
    @keyframes spin { to { transform:rotate(360deg) } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>جاري التحميل...</p>
  </div>
  <script src="./js/app.js"></script>
  <script>
    const token = localStorage.getItem('tbus_token');
    if (!token) {
      window.location.href = '/pages/login.html';
    } else {
      resolveRole().then(role => {
        window.location.href = role === 'Driver' ? '/pages/driver-home.html' : '/pages/dashboard.html';
      });
    }
  </script>
</body>
</html>
